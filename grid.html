<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
  <script src="SCRIPT.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1240px;
            height: 240px;
            margin: 25px auto 0;

            padding: 8px;

            background-color:black;
            border: 2px solid #ff7777;
            border-radius: 0 0 15px 15px;

            display: grid;

            grid-template-columns: 1fr 1.04fr 1.04fr;
            grid-template-rows: 48px 48px 48px 48px;

            gap: 8px;
        }

        .box {
            background-color:#0ccf64;

            border: 2px solid #111;
            border-radius: 15px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 14px;
            color: #000;
        }

        /* Box 1 - Full width */
        .box1 {
            grid-column: 1 / 4;
            grid-row: 1;
        }

        /* Box 2 */
        .box2 {
            grid-column: 1;
            grid-row: 2;
        }

        /* Box 3 - Right side, 2 rows tall */
        .box3 {
            grid-column: 2 / 3;
            grid-row: 2 / 4;
        }

        /* Box 4 */
        .box4 {
            grid-column: 1;
            grid-row: 3;
        }

        /* Box 5 */
        .box5 {
            grid-column: 1;
            grid-row: 4;
        }

        /* Box 6 */
        .box6 {
            grid-column: 2;
            grid-row: 4;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="box box1">1</div>

        <div class="box box2">2</div>

        <div class="box box3">3</div>

        <div class="box box4">4</div>

        <div class="box box5">5</div>

        <div class="box box6">6</div>

    </div>

</body>
</html>
